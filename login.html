<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back | DoBu Martial Arts</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
  <nav class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="index.html">Do<span>Bu</span></a>
      <button class="menu-btn" aria-label="Open navigation">☰</button>
      <div class="nav-links">
        <a href="index.html">Home</a><a href="classes.html">Classes</a><a href="timetable.html">Timetable</a>
        <a href="membership.html">Membership</a><a href="instructors.html">Instructors</a>
        <a href="register.html">Register</a><a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <main class="login-main">
    <div class="login-panel">
      <div class="login-icon" aria-hidden="true">
        <span class="lock-shackle"></span>
        <span class="lock-body"><span class="lock-keyhole"></span></span>
      </div>
      <p class="login-kicker">MEMBER ACCESS</p>
      <h1>Welcome back</h1>
      <p class="login-intro">Sign in to continue to your DoBu Martial Arts member dashboard.</p>

      <div id="loginAlert" class="alert"></div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input id="loginEmail" type="email" required autocomplete="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required autocomplete="current-password"
            placeholder="Enter your password">
        </div>
        <button class="btn btn-primary login-submit" type="submit">Login to Dashboard</button>
      </form>

      <p class="auth-note">New to DoBu? <a class="text-link" href="register.html">Create an account</a></p>
    </div>
  </main>

  <footer>
    <div class="container footer-bottom">© <span id="year"></span> DoBu Martial Arts. Academic project website.</div>
  </footer>
  <script src="js/script.js"></script>
</body>

</html>
